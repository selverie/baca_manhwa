name: manhwa-tracker

services:
  postgres:
    image: postgres:16-alpine
    container_name: manhwa-tracker-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: manhwa_tracker
    ports:
      - '5432:5432'
    volumes:
      - manhwa_postgres_data:/var/lib/postgresql/data
    networks:
      - manhwa-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: builder
    image: manhwa-tracker-api:latest
    container_name: manhwa-tracker-api
    restart: unless-stopped
    command: npm run start:dev
    environment:
      NODE_ENV: development
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: manhwa_tracker
      JWT_SECRET: manhwa-tracker-super-secret-jwt-key-2024
      JWT_EXPIRES_IN: 7d
    ports:
      - '3000:3000'
    volumes:
      - ./backend:/app
      - manhwa_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - manhwa-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: manhwa-tracker-fe
    restart: unless-stopped
    ports:
      - '5173:5173'
    volumes:
      - ./frontend:/app
      - manhwa_fe_node_modules:/app/node_modules
    environment:
      - VITE_API_URL=http://localhost:3000
    networks:
      - manhwa-network

volumes:
  manhwa_postgres_data:
  manhwa_node_modules:
  manhwa_fe_node_modules:

networks:
  manhwa-network:
    driver: bridge